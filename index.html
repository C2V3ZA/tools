<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="C2V3ZA Tools – private Tool-Sammlung.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'">
  <title>C2V3ZA Tools</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="./" aria-label="C2V3ZA Tools Startseite">
      <span class="brand-mark">C2V3ZA</span><span class="brand-word">TOOLS</span>
    </a>
    <span class="status"><span class="status-dot"></span> ONLINE</span>
  </header>

  <main>
    <section class="hero">
      <div class="eyebrow">PRIVATE TOOL LIBRARY</div>
      <h1>Meine <span>Tools.</span></h1>
      <p>Eine zentrale Sammlung meiner Tools, Utilities und kleinen Projekte.</p>
      <div class="hero-line"></div>
    </section>

    <section class="toolbar" aria-label="Tool Suche">
      <input id="search" type="search" placeholder="Tools durchsuchen …" autocomplete="off" maxlength="80">
      <select id="category" aria-label="Kategorie">
        <option value="">Alle Kategorien</option>
      </select>
      <span id="count" class="count">0 TOOLS</span>
    </section>

    <section id="tools" class="grid" aria-live="polite"></section>
    <div id="empty" class="empty" hidden>Keine passenden Tools gefunden.</div>
  </main>

  <footer>
    <span>C2V3ZA TOOLS</span><span>GITHUB PAGES</span>
  </footer>
  <script src="config.js" defer></script><script src="app.js" defer></script>
</body>
</html>
